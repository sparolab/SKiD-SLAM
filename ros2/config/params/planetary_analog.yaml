# Planetary analog site with a legged robot (planetary_analog.bag)
# ROS 2: every node reads both sections (skid_slam.* and mapfusion.*).
/**:
  ros__parameters:
    skid_slam:
      # Topics
      pointCloudTopic: "ouster/points"               # Point cloud data
      imuTopic: "imu/data"                         # IMU data
      odomTopic: "odometry/imu"                   # IMU pre-preintegration odometry, same frequency as IMU

      # Frames
      lidarFrame: "base_link"
      baselinkFrame: "base_link"
      odometryFrame: "odom"
      mapFrame: "map"

      # Initialization
      useImuHeadingInitialization: false           # initialize yaw from the IMU orientation

      # Export settings (written on shutdown to <saveDirectory>/<robot_id>/)
      saveMap: false                              # downsampled global map (.pcd)
      savePoses: false                            # keyframe poses (TUM .txt + .pcd)
      saveScans: false                            # raw keyframe scans in the body frame (.pcd)
      saveWholeMap: false                         # raw keyframe scans stacked at global poses (.pcd)
      saveWholeMapLeafSize: 0.05                  # meters, voxel size of the whole map (0: keep every point)
      saveDirectory: "/tmp/skid_slam"

      # Sensor Settings
      sensor: ouster                            # lidar sensor type, either 'velodyne' or 'ouster'
      N_SCAN: 64                               # number of lidar channel (i.e., 16, 32, 64, 128)
      Horizon_SCAN: 1024                          # lidar horizontal resolution (Velodyne:1800, Ouster:512,1024,2048)
      downsampleRate: 1                           # default: 1. Downsample your data if too many points. i.e., 16 = 64 / 4, 16 = 16 / 1
      lidarMinRange: 3.0                          # default: 1.0, minimum lidar range to be used
      lidarMaxRange: 1000.0                       # default: 1000.0, maximum lidar range to be used

      # IMU Settings
      imuType: 1
      imuAccNoise: 3.9939570888238808e-03
      imuGyrNoise: 1.5636343949698187e-03
      imuAccBiasN: 6.4356659353532566e-05
      imuGyrBiasN: 3.5640318696367613e-05
      imuGravity: 9.80511
      imuRPYWeight: 0.01

      # Extrinsics (lidar -> IMU)
      extrinsicTrans: [0.0, 0.0, 0.0]
      extrinsicRot: [0, 1, 0,
                    -1, 0, 0,
                     0, 0, 1]
      extrinsicRPY: [0, 1, 0,
                    -1, 0, 0,
                     0, 0, 1]

      # LOAM feature threshold
      edgeThreshold: 1.0
      surfThreshold: 0.1
      edgeFeatureMinValidNum: 10
      surfFeatureMinValidNum: 100

      # voxel filter paprams
      odometrySurfLeafSize: 0.1                     # default: 0.4
      mappingCornerLeafSize: 0.05                    # default: 0.2
      mappingSurfLeafSize: 0.1                      # default: 0.4

      # robot motion constraint (in case you are using a 2D robot)
      z_tollerance: 1000                            # meters
      rotation_tollerance: 1000                     # radians

      # CPU Params
      numberOfCores: 4                              # number of cores for mapping optimization
      mappingProcessInterval: 0.15                  # seconds, regulate mapping frequency

      # Surrounding map
      surroundingkeyframeAddingDistThreshold: 0.5   # meters, regulate keyframe adding threshold
      surroundingkeyframeAddingAngleThreshold: 0.1  # radians, regulate keyframe adding threshold
      surroundingKeyframeDensity: 0.5               # meters, downsample surrounding keyframe poses   
      surroundingKeyframeSearchRadius: 20.0         # meters, within n meters scan-to-map optimization (when loop closure disabled)

      # Loop closure
      loopClosureEnableFlag: true
      loopClosureFrequency: 1.0                     # Hz, regulate loop closure constraint add frequency
      surroundingKeyframeSize: 50                   # submap size (when loop closure enabled)
      historyKeyframeSearchRadius: 15.0             # meters, key frame that is within n meters from current pose will be considerd for loop closure
      historyKeyframeSearchTimeDiff: 30.0           # seconds, key frame that is n seconds older will be considered for loop closure
      historyKeyframeSearchNum: 25                  # number of hostory key frames will be fused into a submap for loop closure
      historyKeyframeFitnessScore: 0.3              # icp threshold, the smaller the better alignment

      # Visualization
      globalMapVisualizationSearchRadius: 1000.0    # meters, global map visualization radius
      globalMapVisualizationPoseDensity: 2.0        # meters, global map visualization keyframe density
      globalMapVisualizationLeafSize: 0.25         # meters, global map visualization cloud density
      globalMapVisualizationRaw: true               # build the visualized map from raw scans (denser, more memory)
      globalMapVisualizationRate: 1.0               # Hz, global map publishing rate
      globalMapVisualizationRawRange: 40.0          # meters, raw points kept per keyframe in the visualized map (0: all)

    mapfusion:
      robot_initial: jackal0              # robot whose odom frame anchors the global map
      topic: "context"                    # namespace of inter-robot messages
      frame: "base_link"
      local_topic: "skid_slam/mapping/cloud_info"
      loop_frame_threshold: 10            # keyframes between two loops used as an intra-robot constraint

      solid:                              # SOLiD descriptor
        num_range: 40
        num_angle: 60
        num_height: 64
        min_range: 0.0
        max_range: 40.0
        fov_up: 22.5
        fov_down: -22.5
        voxel_size: 0.0                   # <= 0 disables downsampling

      retrieval:
        num_nearest: 30                   # KD-tree candidates
        num_candidates: 1                 # candidates passed to registration
        loop_threshold: 0.5              # max SOLiD distance (1 - cosine similarity)
        use_position_search: false        # fall back to position search once robots are aligned
        position_search_radius_this: 5.0
        position_search_radius_other: 10.0

      registration:
        voxel_size: 0.75
        use_kiss_matcher: true            # false: small_gicp only (no global registration)
        kiss_matcher:
          normal_radius_gain: 3.5
          fpfh_radius_gain: 5.0
          linearity_threshold: 0.99
          robin_noise_bound_gain: 1.0
          solver_noise_bound_gain: 1.0
          robin_mode: "max_core"
          use_ratio_test: true
          tuple_scale: 0.95
          use_quatro: false
        gicp:
          num_threads: 4
          downsampling_resolution: 0.25
          max_correspondence_distance: 1.0
        fitness_threshold: 1.2           # accept a loop if fitness score is below this
        fitness_max_distance: 100.0

      pcm:                                # pairwise consistency maximization
        enable: true
        start_threshold: 2             # 5 for best accuracy, 2 for harsh environments
        threshold: 5
